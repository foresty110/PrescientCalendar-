name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prescient
          POSTGRES_PASSWORD: prescient
          POSTGRES_DB: prescient
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prescient"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://prescient:prescient@localhost:5432/prescient?schema=public
      AUTH_SECRET: ci-only-dummy-secret-not-for-production
      AUTH_URL: http://localhost:3000
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
      ANTHROPIC_API_KEY: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
