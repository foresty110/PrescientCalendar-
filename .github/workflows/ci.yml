name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prescient
          POSTGRES_PASSWORD: prescient
          POSTGRES_DB: prescient
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prescient"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://prescient:prescient@localhost:5432/prescient?schema=public
      AUTH_SECRET: ci-only-dummy-secret-not-for-production
      AUTH_URL: http://localhost:3000
      AUTH_GOOGLE_ID: ci-dummy
      AUTH_GOOGLE_SECRET: ci-dummy
      ANTHROPIC_API_KEY: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version은 package.json의 packageManager 필드를 단일 출처로 사용

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts: pnpm 11이 ignored build scripts를 error로 처리하는 것 회피.
      # prebuilt 바이너리(sharp, esbuild)는 그대로 동작. Prisma client만 명시 generate.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm prisma generate

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
