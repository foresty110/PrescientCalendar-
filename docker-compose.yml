services:
  postgres:
    image: postgres:16-alpine
    container_name: prescient-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prescient
      POSTGRES_PASSWORD: prescient
      POSTGRES_DB: prescient
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prescient"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
